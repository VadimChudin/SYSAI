services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: sysai
      POSTGRES_USER: sysai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    ports: ["127.0.0.1:${POSTGRES_PORT:-5433}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sysai -d sysai"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  sysai:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://sysai:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/sysai
    depends_on:
      db:
        condition: service_healthy
    ports: ["8000:8000"]
    volumes: ["./data:/srv/data"]
    restart: unless-stopped

volumes:
  postgres_data:
